<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinny的AI百寶箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #FEF9E7; /* 淡鵝黃色底 */
            color: #1E293B; /* 黑字/深深灰字 */
        }
        .comic-card {
            border: 3.5px solid #1E293B;
            box-shadow: 6px 6px 0px #1E293B;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .comic-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 10px 10px 0px #1E293B;
        }
        .comic-btn {
            border: 3px solid #1E293B;
            box-shadow: 4px 4px 0px #1E293B;
            transition: all 0.15s ease-in-out;
        }
        .comic-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #1E293B;
        }
        .comic-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #1E293B;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 font-sans">

    <!-- 主容器 -->
    <div class="w-full max-w-5xl flex flex-col items-center">

        <!-- 頂部 Banner 區塊 -->
        <header class="w-full mb-8 comic-card rounded-3xl overflow-hidden bg-white">
            <img src="Banner.png" alt="Vinny的AI百寶箱 Banner" class="w-full h-auto object-cover block">
        </header>

        <!-- 工具按鈕入口區域 (左：圖片提示詞 / 右：音樂提示詞) -->
        <main class="w-full grid grid-cols-1 md:grid-cols-2 gap-8 my-4">
            
            <!-- 左側：圖片提示詞生成工具 -->
            <a href="Image.html" class="comic-card bg-white rounded-3xl p-8 flex flex-col items-center text-center justify-between group cursor-pointer text-slate-900 no-underline">
                <div class="flex flex-col items-center">
                    <div class="w-24 h-24 rounded-full bg-amber-100 border-4 border-slate-900 flex items-center justify-center text-4xl text-orange-500 mb-5 group-hover:rotate-12 transition-transform shadow-inner">
                        🎨
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-black mb-3">圖片提示詞生成工具</h2>
                    <p class="text-base text-slate-600 font-medium leading-relaxed">
                        支援 10 種精選卡片風格、尺寸及主題設定，一鍵輸出高品質 AI 生圖提示詞！
                    </p>
                </div>
                <div class="w-full mt-8">
                    <span class="comic-btn w-full block py-4 bg-orange-500 hover:bg-orange-400 text-white font-black text-xl rounded-2xl text-center">
                        <i class="fas fa-wand-magic-sparkles mr-2"></i> 前往圖片生成
                    </span>
                </div>
            </a>

            <!-- 右側：音樂提示詞生成工具 -->
            <a href="Music.html" class="comic-card bg-white rounded-3xl p-8 flex flex-col items-center text-center justify-between group cursor-pointer text-slate-900 no-underline">
                <div class="flex flex-col items-center">
                    <div class="w-24 h-24 rounded-full bg-amber-100 border-4 border-slate-900 flex items-center justify-center text-4xl text-orange-500 mb-5 group-hover:-rotate-12 transition-transform shadow-inner">
                        🎵
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-black mb-3">音樂提示詞生成工具</h2>
                    <p class="text-base text-slate-600 font-medium leading-relaxed">
                        自由搭配流行、搖滾等多階層音樂曲風與樂器元素，打造專屬 SUNO 提示詞！
                    </p>
                </div>
                <div class="w-full mt-8">
                    <span class="comic-btn w-full block py-4 bg-orange-500 hover:bg-orange-400 text-white font-black text-xl rounded-2xl text-center">
                        <i class="fas fa-music mr-2"></i> 前往音樂生成
                    </span>
                </div>
            </a>

        </main>
    </div>

    <!-- 頁尾宣告 -->
    <footer class="mt-12 text-center text-sm font-bold text-slate-700">
        Copyright &copy; Vinny的AI百寶箱
    </footer>

</body>
</html>
